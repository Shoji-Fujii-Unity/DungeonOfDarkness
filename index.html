<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dungeon of Darkness</title>
<style>
:root{--bg:#0a0a12;--panel:#14141f;--border:#3a3a55;--gold:#d4af37;--txt:#cfcfe0;--red:#e05555;--green:#55c06a;--blue:#5588e0;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#000;color:var(--txt);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,monospace,sans-serif;overflow:hidden}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}
#screen-title,#screen-over{align-items:center;justify-content:center;padding:20px;text-align:center}
#screen-title{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#202039 0,#11111e 42%,#07070d 100%)}
#screen-title::before{content:"";position:absolute;inset:15px;border:1px solid #d4af3744;box-shadow:inset 0 0 45px #090911;pointer-events:none}
#screen-title::after{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(130deg,transparent 0 38px,#c6a14708 39px 40px,transparent 41px 78px),radial-gradient(ellipse at 50% 90%,#7d301733,transparent 55%);pointer-events:none}
#screen-title>*{position:relative;z-index:1}
#screen-create{align-items:center;justify-content:flex-start;padding:20px 14px;text-align:center;overflow-y:auto}
.logo{font-size:clamp(34px,10vw,48px);font-weight:bold;line-height:1.04;color:#f0d788;text-shadow:0 2px 0 #694b1c,0 0 24px #d4af3777;letter-spacing:5px;margin-bottom:12px}
.logo span{font-size:.72em;letter-spacing:8px;color:#c5b88e}
.logo-sub{color:#a6a0ad;margin-bottom:38px;font-size:11px;letter-spacing:3px}
.title-mark{width:82px;height:82px;margin-bottom:20px;border:1px solid #d4af3788;border-radius:50%;display:grid;place-items:center;color:#e3c765;font-size:38px;text-shadow:0 0 20px #d4af37;box-shadow:0 0 28px #d4af3722,inset 0 0 20px #d4af3718}
.tbtn{display:block;width:230px;padding:13px;margin:7px auto;background:var(--panel);border:1px solid var(--border);color:var(--txt);font-size:15px;border-radius:6px;cursor:pointer}
.tbtn:active{background:#252540}
.tbtn.gold{border-color:var(--gold);color:var(--gold)}
.tbtn:disabled{opacity:.35}
/* ---- create ---- */
#create-slots{display:flex;gap:6px;margin:14px 0;width:100%;max-width:380px}
.slot{flex:1;padding:9px 2px;background:var(--panel);border:1px solid var(--border);color:var(--txt);border-radius:6px;font-size:10px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot.cur{border-color:var(--gold);color:var(--gold)}
.slot.done{border-color:var(--green);color:var(--green)}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;text-align:left}
.crow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12px;border-bottom:1px solid #22223a;flex-wrap:wrap}
.crow:last-child{border:none}
.pick{background:#1c1c30;border:1px solid var(--border);color:var(--txt);border-radius:5px;padding:6px 9px;font-size:11px;cursor:pointer;margin-left:4px}
.pick.on{border-color:var(--gold);color:var(--gold)}
input#in-name{background:#0d0d1a;border:1px solid var(--border);color:var(--txt);border-radius:4px;padding:6px;width:100px;font-size:12px}
.ab{width:28px;height:28px;background:#1c1c30;border:1px solid var(--border);color:var(--gold);border-radius:4px;font-size:15px;cursor:pointer;margin-left:4px}
.ab:disabled{opacity:.25}
.statv{color:#8ac;min-width:34px;display:inline-block;text-align:right}
.bonus-note{font-size:10px;color:#778;width:100%;margin-top:4px}
/* ---- game ---- */
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#0d0d18;border-bottom:1px solid var(--border);font-size:12px;padding-top:calc(6px + env(safe-area-inset-top))}
#hud button{background:none;border:1px solid var(--border);color:var(--txt);border-radius:4px;padding:3px 7px;font-size:11px;cursor:pointer;margin-left:4px}
#view-wrap{position:relative;background:#000;line-height:0}
canvas#view{width:100%;display:block;image-rendering:pixelated;aspect-ratio:8/5}
#log{height:64px;overflow-y:auto;padding:5px 10px;font-size:12px;line-height:1.55;background:#0c0c16;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}
#log .r{color:var(--red)} #log .g{color:var(--green)} #log .y{color:var(--gold)} #log .b{color:#7af}
#party{display:flex;gap:4px;padding:5px 6px;background:#101020;border-bottom:1px solid var(--border);overflow-x:auto}
.pchip{flex:1;min-width:80px;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:4px 6px;font-size:10px;line-height:1.4;cursor:pointer}
.pchip .n{color:var(--gold);font-size:11px}
.pchip .bar{height:4px;background:#222;border-radius:2px;overflow:hidden;margin-top:2px}
.pchip .bar i{display:block;height:100%}
.hpbar{background:var(--red)} .mpbar{background:var(--blue)}
.pchip.dead{opacity:.45}.pchip.turn{border-color:var(--gold);box-shadow:0 0 6px #d4af3755}
#controls{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 10px calc(12px + env(safe-area-inset-bottom));gap:8px;background:#0b0b15}
.cpad{display:flex;justify-content:center;gap:8px}
.cb{width:74px;height:56px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cb:active{background:#2a2a48}
.cb.small{width:56px;font-size:13px}
.abtn{flex:1;padding:14px 4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-size:13px;cursor:pointer;text-align:center}
.abtn:active{background:#2a2a48}
#overlay{position:absolute;inset:0;background:rgba(0,0,10,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#overlay.show{display:flex}
#panel{background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:16px;width:100%;max-width:340px;max-height:85%;overflow-y:auto}
#panel h3{color:var(--gold);font-size:15px;margin-bottom:10px;text-align:center}
.pbtn{display:block;width:100%;padding:10px;margin:6px 0;background:#1c1c30;border:1px solid var(--border);color:var(--txt);border-radius:6px;font-size:13px;cursor:pointer;text-align:left;line-height:1.7}
.pbtn:active{background:#2e2e50}
.pbtn:disabled{opacity:.85;cursor:default;border-color:#2a2a40}
.pbtn small{color:#8ab;font-size:11px;float:right;margin-top:2px}
.pbtn.center{text-align:center}
.pbtn.head{background:none;border:none;color:#778;font-size:10px;padding:2px 4px;margin:8px 0 2px}
#over-msg{font-size:15px;line-height:1.9;margin-bottom:20px;white-space:pre-line}
</style>
</head>
<body>
<div id="app">

  <div class="screen active" id="screen-title">
      <div class="title-mark" aria-hidden="true">✦</div>
      <div class="logo">DUNGEON<br><span>OF DARKNESS</span></div>
    <div class="logo-sub" data-i18n="subtitle"></div>
    <button class="tbtn gold" id="btn-new" data-i18n="new"></button>
    <button class="tbtn" id="btn-load" data-i18n="load"></button>
    <div style="margin-top:30px">
      <button class="tbtn" style="width:200px;display:inline-block;margin:0 4px" id="btn-lang-title"></button>
      <button class="tbtn" style="width:110px;display:inline-block;margin:0 4px" id="btn-snd-title"></button>
    </div>
  </div>

  <div class="screen" id="screen-create">
    <div class="logo" style="font-size:20px;margin:10px 0" data-i18n="create_t"></div>
    <div id="create-slots"></div>
    <div class="card" id="create-editor"></div>
    <button class="tbtn" id="btn-reroll" data-i18n="random_all"></button>
    <button class="tbtn gold" id="btn-start" data-i18n="start"></button>
  </div>

  <div class="screen" id="screen-game">
    <div id="hud">
      <span><span id="hud-floor"></span>&nbsp;&nbsp;<span id="hud-gold" style="color:var(--gold)"></span></span>
      <span>
        <button id="btn-map">MAP</button>
        <button id="btn-save">💾</button>
        <button id="btn-snd"></button>
        <button id="btn-lang"></button>
      </span>
    </div>
    <div id="view-wrap"><canvas id="view" width="256" height="160"></canvas></div>
    <div id="log"></div>
    <div id="party"></div>
    <div id="controls"></div>
  </div>

  <div class="screen" id="screen-over">
    <div class="logo" style="font-size:24px" id="over-title"></div>
    <div id="over-msg"></div>
    <button class="tbtn gold" id="btn-over-load" data-i18n="load"></button>
    <button class="tbtn" id="btn-over-new" data-i18n="new"></button>
  </div>

  <div id="overlay"><div id="panel"></div></div>
</div>

const RACE={ja:{human:"人間",elf:"エルフ",dwarf:"ドワーフ"},en:{human:"Human",elf:"Elf",dwarf:"Dwarf"}};
const NAMES=["Aldric","Myra","Corvin","Selene","Draven","Ysolde","Garrick","Faelan","Bryn","Rowena","Kael","Thessa"];

/* ================= state ================= */
let S=null,mode="title",combat=null,showMap=false;
const $=id=>document.getElementById(id);
function lockControls(){$("controls").innerHTML=""}   // 入力待ち受け中の連打防止
const rnd=n=>Math.floor(Math.random()*n);
// 修正版: %s / %d を出現順に置換
const t=(k,...a)=>{const dict=S?I18N[S.lang]:I18N.ja;let s=dict[k]||k;let i=0;s=s.replace(/%[sd]/g,()=>String(a[i++]));return s};
const eName=k=>{try{return (I18N[S.lang].enemy_names||{})[k]||k}catch(e){return k}};

/* ================= sound ================= */
let AC=null;
function beep(f,d,type="square",g=0.08,delay=0){if(!S||!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,AC.currentTime+delay);v.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+delay+d);o.connect(v);v.connect(AC.destination);o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+d+0.02)}catch(e){}}
const SFX={step:()=>beep(90,.06,"square",.05),hit:()=>{beep(180,.1,"sawtooth",.1);beep(120,.12,"sawtooth",.08,.04)},crit:()=>{beep(300,.08,"sawtooth",.12);beep(150,.18,"sawtooth",.1,.06)},hurt:()=>beep(70,.2,"sawtooth",.1),magic:()=>{beep(400,.1,"sine",.1);beep(600,.1,"sine",.1,.08);beep(900,.15,"sine",.1,.16)},heal:()=>{beep(520,.12,"sine",.08);beep(660,.15,"sine",.08,.1)},gold:()=>{beep(900,.07,"square",.07);beep(1300,.1,"square",.07,.06)},equip:()=>{beep(300,.06,"triangle",.08);beep(450,.08,"triangle",.08,.06)},levelup:()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.15,"square",.08,i*.12))},stairs:()=>{[400,300,200].forEach((f,i)=>beep(f,.1,"triangle",.08,i*.09))},err:()=>beep(150,.15,"square",.06),encounter:()=>{beep(220,.12,"sawtooth",.1);beep(180,.12,"sawtooth",.1,.1);beep(140,.25,"sawtooth",.1,.2)},flee:()=>{[600,500,400,300].forEach((f,i)=>beep(f,.07,"square",.06,i*.05))},death:()=>{[300,250,200,150,100].forEach((f,i)=>beep(f,.3,"sawtooth",.1,i*.2))}};

const MW=23,MH=23;
function genFloor(n){
  const tiles=Array.from({length:MH},()=>Array(MW).fill(0));
  const start=[11,11],stack=[start],visited=new Set([start.join()]);
  tiles[start[1]][start[0]]=1;
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const options=[[0,-2],[2,0],[0,2],[-2,0]]
      .map(([dx,dy])=>[x+dx,y+dy,dx,dy])
      .filter(([nx,ny])=>nx>0&&nx<MW-1&&ny>0&&ny<MH-1&&!visited.has(`${nx},${ny}`));
    if(!options.length){stack.pop();continue}
    const [nx,ny,dx,dy]=options[rnd(options.length)];
    visited.add(`${nx},${ny}`);tiles[y+dy/2][x+dx/2]=1;tiles[ny][nx]=1;stack.push([nx,ny]);
  }
  const carveChamber=([cx,cy])=>{
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)tiles[cy+oy][cx+ox]=1;
  };
  carveChamber(start);
  const chambers=[[3,3],[19,3],[3,19],[19,19]];
  shuffle(chambers);
  chambers.slice(0,n>=4?2:1).forEach(carveChamber);
  const distances=Array.from({length:MH},()=>Array(MW).fill(-1));
  const queue=[start];distances[start[1]][start[0]]=0;
  for(let qi=0;qi<queue.length;qi++){
    const [x,y]=queue[qi];
    for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH||tiles[ny][nx]===0||distances[ny][nx]>=0)continue;
      distances[ny][nx]=distances[y][x]+1;queue.push([nx,ny]);
    }
  }
  const cells=[];
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(tiles[y][x]===1)cells.push([x,y]);
  const farthest=cells.reduce((best,c)=>distances[c[1]][c[0]]>distances[best[1]][best[0]]?c:best,start);
  tiles[farthest[1]][farthest[0]]=n>=5?9:2;
  const available=cells.filter(([x,y])=>tiles[y][x]===1&&distances[y][x]>=3);
  shuffle(available);
  const services=available.splice(0,2);
  if(services[0])tiles[services[0][1]][services[0][0]]=3;
  if(services[1])tiles[services[1][1]][services[1][0]]=4;
  available.slice(0,3+Math.min(2,n-1)).forEach(([x,y])=>tiles[y][x]=5);
  S.px=start[0];S.py=start[1];S.dir=0;
  S.map=tiles;S.explored=Array.from({length:MH},()=>Array(MW).fill(0));
  reveal();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}}
function reveal(){const r=4;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const x=S.px+dx,y=S.py+dy;if(x>=0&&x<MW&&y>=0&&y<MH&&Math.abs(dx)+Math.abs(dy)<=r+1)S.explored[y][x]=1}}

function drawSprites(zbuf,rdx,rdy,planeLen){
  const items=[];const R=9;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    const x=S.px+dx,y=S.py+dy;if(x<0||y<0||x>=MW||y>=MH)continue;
    const tile=S.map[y][x];if(tile<2)continue;

    const sx=it.x+0.5-ex,sy=it.y+0.5-ey;
    const trX=invDet*(rdy*sx-rdx*sy);
    const trY=invDet*(-pdy*sx+pdx*sy);
    if(trY<=0.15)continue;
    const scrX=Math.floor(W/2*(1+trX/trY));
    const size=Math.min(H*1.6,Math.abs(H/trY)*0.8);

function drawCombat(){
  const theme=DUNGEON_THEMES[(S.floor-1)%DUNGEON_THEMES.length];
  const g=ctx.createRadialGradient(W/2,H*.35,5,W/2,H*.5,W*.75);g.addColorStop(0,theme.accent);g.addColorStop(.42,"#19131f");g.addColorStop(1,"#050308");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#100d16";ctx.fillRect(0,0,24,H*.75);ctx.fillRect(W-24,0,24,H*.75);
  ctx.fillStyle="#31263a";ctx.fillRect(15,0,6,H*.76);ctx.fillRect(W-21,0,6,H*.76);
  ctx.fillStyle=theme.glow;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(18,H*.28,3,0,Math.PI*2);ctx.arc(W-18,H*.28,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle="#c9b27624";
  for(let i=0;i<7;i++){const y=H*.65+i*i*1.35;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let i=0;i<=8;i++){const x=W*i/8;ctx.beginPath();ctx.moveTo(W/2,H*.59);ctx.lineTo(x,H);ctx.stroke()}
  const alive=combat.enemies;const n=alive.length;
  alive.forEach((e,i)=>{
    if(e.dead)return;
    const ex=W*(i+1)/(n+1),sz=e.key==="lich"?108:n===1?96:62;
    if(combat.targetIdx===i){
      const aura=ctx.createRadialGradient(ex,H*.47,5,ex,H*.48,sz*.72);
      aura.addColorStop(0,"#ffd98722");aura.addColorStop(1,"#ffd98700");
      ctx.fillStyle=aura;ctx.beginPath();ctx.ellipse(ex,H*.48,sz*.72,sz*.58,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#e8c77999";ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(ex,H*.68,sz*.46,6,0,0,Math.PI*2);ctx.stroke();
    }
    drawMonster(e.key,ex,H*.76,sz);
  });
  const cur=combat.enemies[combat.targetIdx]&&!combat.enemies[combat.targetIdx].dead?combat.enemies[combat.targetIdx]:combat.enemies.find(e=>!e.dead)||combat.enemies[0];
  ctx.textAlign="center";ctx.font="bold 12px sans-serif";ctx.fillStyle="#f1dfb6";ctx.shadowColor="#000";ctx.shadowBlur=4;
  ctx.fillText(eName(cur.key),W/2,H-27);ctx.shadowBlur=0;
  const maxE=ENEMIES[cur.key].hp,wpc=Math.max(0,cur.hp/maxE)*(W*.42);
  ctx.fillStyle="#2a121d";ctx.fillRect(W*.29,H-20,W*.42,5);
  const hp=ctx.createLinearGradient(W*.29,0,W*.71,0);hp.addColorStop(0,"#9d283e");hp.addColorStop(1,"#f06a50");
  ctx.fillStyle=hp;ctx.fillRect(W*.29,H-20,wpc,5);
  ctx.strokeStyle="#d6b67a88";ctx.strokeRect(W*.29+.5,H-20.5,W*.42-1,6);
}

/* ================= UI helpers ================= */
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active")}
function msg(txt,cls=""){const l=$("log");const d=document.createElement("div");if(cls)d.className=cls;d.textContent=txt;l.appendChild(d);while(l.children.length>40)l.removeChild(l.firstChild);l.scrollTop=l.scrollHeight}
function panel(title,buttons){
  const p=$("panel");p.innerHTML="";if(title){const h=document.createElement("h3");h.textContent=title;p.appendChild(h)}
  buttons.forEach(b=>{
    if(b.head){const el=document.createElement("div");el.className="pbtn head";el.textContent=b.label;p.appendChild(el);return}
    const el=document.createElement("button");el.className="pbtn"+(b.center?" center":"");el.innerHTML=b.label+(b.sub?`<small>${b.sub}</small>`:"");if(b.disabled)el.disabled=true;else el.onclick=()=>{closePanel();b.fn&&b.fn()};p.appendChild(el)});

}
function closePanel(){$("overlay").classList.remove("show")}

/* ================= party UI & status ================= */
let turnIdx=-1;
function renderParty(){
  const el=$("party");el.innerHTML="";

      <div>MP ${m.mp}/${m.maxmp}<div class="bar"><i class="mpbar" style="width:${m.maxmp?m.mp/m.maxmp*100:0}%"></i></div></div>`;

function showStatus(m){
  ensureEquip(m);
  const known=Object.entries(SPELLS).filter(([k,s])=>s.cls===m.cls&&m.lvl>=s.lv).map(([k])=>t("spell_"+k)).join(", ")||t("none");
  const bonus=f=>eqBonus(m,f);
  const bv=f=>{const b=bonus(f);return b?(b>0?` <span style="color:var(--green)">(+${b})</span>`:` <span style="color:var(--red)">(${b})</span>`):""};
  const rows=[];
  rows.push({disabled:true,label:`<b style="color:var(--gold)">${m.name}</b> Lv${m.lvl}<br><small style="float:none;color:#99a;display:block">${RACE[S.lang][m.race]} / ${CLS[S.lang][m.cls]}</small>HP ${Math.max(0,m.hp)} / ${m.maxhp}<br>MP ${m.mp} / ${m.maxmp}<br>ATK ${eAtk(m)}${bv("atk")} &nbsp;DEF ${eDef(m)}${bv("def")} &nbsp;SPD ${eSpd(m)}${bv("spd")}<br>${t("exp_v",m.exp,expNeed(m.lvl))}<br>${t("spells_v")}: ${known}`});
  // 装備中(解除ボタン)
  rows.push({head:true,label:`⚔ ${t("status_t")} — ${CLS[S.lang][m.cls]}`});
  EQ_SLOTS.forEach(sl=>{
    if(m.eq[sl])rows.push({label:`✖ ${t("unequip")}: ${eqName(m.eq[sl])}`,sub:t("slot_"+sl),fn:()=>{unequipSlot(m,sl);showStatus(m)}});
    else rows.push({disabled:true,label:`— ${t("slot_"+sl)} —`,sub:""});
  });
  // 所持装備からの装着
  if(S.gear&&S.gear.length){
    rows.push({head:true,label:t("equip_t",S.gear.length)});
    S.gear.forEach((k,i)=>{
      const e=EQUIPS[k];if(!e)return;
      const ok=e.cls.includes(m.cls);
      rows.push({label:`${t("equip")}: ${eqName(k)}`,sub:`[${t("slot_"+e.type)}] ${eqStatStr(e)}${ok?"":" ⚠"}`,disabled:!ok,fn:()=>{equipFromGear(m,i);showStatus(m)}});
    });
  }
  rows.push({label:t("close"),center:true});
  panel(t("status_t"),rows);
}
function renderHUD(){

/* ================= explore ================= */
function renderControls(){
  const c=$("controls");c.innerHTML="";
  if(mode==="explore"){
    c.innerHTML=`<div class="cpad">
      <button class="cb" id="b-rl">◀</button>
      <button class="cb" id="b-fwd">▲</button>
      <button class="cb" id="b-rr">▶</button></div>
      <div class="cpad"><button class="cb small" id="b-back">↩ 180°</button><button class="cb small" style="width:130px" id="b-look">${t("explore_look")}</button></div>`;
    $("b-rl").onclick=()=>turn(-1);$("b-rr").onclick=()=>turn(1);$("b-fwd").onclick=()=>move(1);
    $("b-back").onclick=()=>{S.dir=(S.dir+2)%4;draw3D()};$("b-look").onclick=look;
  }
}
function turn(d){if(mode!=="explore")return;S.dir=(S.dir+d+4)%4;beep(140,.04,"square",.04);draw3D()}
function move(step){
  if(mode!=="explore")return;
  const nx=S.px+DX[S.dir]*step,ny=S.py+DY[S.dir]*step;
  if(nx<0||ny<0||nx>=MW||ny>=MH||S.map[ny][nx]===0){SFX.err();return}
  S.px=nx;S.py=ny;SFX.step();reveal();draw3D();
  const tile=S.map[ny][nx];
  if(tile===2){panel(t("descend"),[{label:"▼ "+t("yes"),center:true,fn:()=>descend()},{label:t("cancel"),center:true}]);return}
  if(tile===9){S.map[ny][nx]=1;msg(t("boss_door"),"r");startCombat(["lich"],true);return}
  if(tile===3){openShop();return}
  if(tile===4){openHealer();return}
  if(tile===5){openChest(nx,ny);return}
  const alive=S.party.filter(m=>m.hp>0);
  if(alive.length&&Math.random()<0.07){
    const thief=alive.find(m=>m.cls==="thief");
    if(thief&&Math.random()<0.6){msg(t("thief_detect",thief.name),"b");SFX.gold()}
    else{const dmg=4+S.floor*3+rnd(4);alive.forEach(m=>m.hp=Math.max(0,m.hp-dmg));msg(t("trap_msg",dmg),"r");SFX.hurt();renderParty();checkWipe();return}
  }
  if(Math.random()<0.2){
    const tbl=FLOORS[Math.min(S.floor-1,4)];const key=tbl[rnd(tbl.length)];
    const n=1+rnd(Math.min(3,S.floor));startCombat(Array(n).fill(key),false);
  }
}
function look(){
  if(mode!=="explore")return;
  for(let d=1;d<=6;d++){
    const x=S.px+DX[S.dir]*d,y=S.py+DY[S.dir]*d;
    if(x<0||y<0||x>=MW||y>=MH)break;
    const tile=S.map[y][x];
    if(tile===0){msg(t("look_none"));return}
    if(tile>=2){const names={2:"🪜 ⬇",3:t("shop_t"),4:t("heal_t"),5:"📦",9:"🚪"};msg(names[tile],"y");return}
  }
  msg(t("look_none"));
}
function descend(){S.floor++;genFloor(S.floor);SFX.stairs();saveGame(true);renderHUD();renderParty();draw3D();msg(`— ${t("floor",S.floor)} —`,"y")}
function openChest(x,y){
  S.map[y][x]=1;reveal();renderHUD();draw3D();
  const r=Math.random();const g=10+S.floor*15+rnd(20*S.floor);
  if(r<0.4){S.gold+=g;msg(t("chest_gold",g),"y");SFX.gold()}
  else if(r<0.6){const it=r<0.5?"potion":"ether";S.items[it]++;msg(t("chest_item",t("item_"+it)),"y");SFX.gold()}
  else{const key=rollGear(1+Math.floor(S.floor/2));S.gear.push(key);msg(t("chest_item",eqName(key)),"y");SFX.equip()}
}
function openShop(){
  const items=[["potion",30],["ether",25]];
  const btns=items.map(([k,p])=>({label:t("item_"+k),sub:t("buy",p),disabled:S.gold<p,fn:()=>{S.gold-=p;S.items[k]++;SFX.gold();msg(t("bought"));renderHUD();openShop()}}));
  btns.push({label:t("close"),center:true});
  panel(t("shop_t")+` (${t("gold",S.gold)})`,btns);
}
function openHealer(){
  const cost=8+S.floor*6;
  const btns=S.party.map(m=>({label:m.name+(m.hp<=0?" 💀":""),sub:`${cost} G`,disabled:S.gold<cost||(m.hp>=m.maxhp&&m.hp>0),fn:()=>{S.gold-=cost;m.hp=m.maxhp;SFX.heal();msg(t("healed_msg",m.name),"g");renderHUD();renderParty();openHealer()}}));
  btns.push({label:t("close"),center:true});
  panel(t("heal_t"),btns);
}

/* ================= combat ================= */
function startCombat(keys,isBoss){
  mode="combat";lockControls();          // ← 追記:移動ボタンを即除去
  SFX.encounter();turnIdx=-1;
  combat={enemies:keys.map(k=>({key:k,hp:ENEMIES[k].hp,dead:false})),queue:[],round:0,targetIdx:0,boss:isBoss};
  msg(t("encounter",keys.map(eName).join(", ")),"r");msg(t("combat_start"),"y");
  nextRound();renderParty();drawCombat();
  setTimeout(nextTurn,500);
}
function nextRound(){combat.queue=[...S.party.keys(),...combat.enemies.keys()].sort((a,b)=>{
  const sa=a<S.party.length?eSpd(S.party[a]):ENEMIES[combat.enemies[a-S.party.length].key].spd;
  const sb=b<S.party.length?eSpd(S.party[b]):ENEMIES[combat.enemies[b-S.party.length].key].spd;return sb-sa});}
function nextTurn(){
  if(S.party.every(m=>m.hp<=0)){gameOver();return}
  if(combat.enemies.every(e=>e.dead)){endCombat();return}
  while(true){
    if(!combat.queue.length){nextRound();combat.round++}
    const u=combat.queue.shift();
    if(u<S.party.length){const m=S.party[u];if(m.hp<=0)continue;turnIdx=u;renderParty();msg(t("turn_to",m.name),"b");showCombatUI(m);return}
    else{const e=combat.enemies[u-S.party.length];if(e.dead)continue;enemyAct(e);return}
  }
}
function aliveEnemies(){return combat.enemies.map((e,i)=>({...e,idx:i})).filter(e=>!e.dead)}
function showCombatUI(m){
  const c=$("controls");c.innerHTML="";
  const row=document.createElement("div");row.className="cpad";
  [[t("cmd_attack"),()=>attackPhase()],["✦ "+t("cmd_spell"),()=>spellMenu(m)],["◈ "+t("cmd_item"),()=>itemMenu(m)],["💨 "+t("cmd_flee"),()=>flee(m)]].forEach(([label,fn])=>{
    const b=document.createElement("button");b.className="abtn";b.textContent=label;b.onclick=fn;row.appendChild(b);
  });c.appendChild(row);
}
function attackPhase(){
  const es=aliveEnemies();if(!es.length)return nextTurn();
  panel(t("cmd_attack"),es.map(e=>({label:`${ENEMIES[e.key].emoji} ${eName(e.key)}`,sub:`HP ${e.hp}`,fn:()=>doAttack(e.idx)})).concat([{label:t("cancel"),center:true,fn:nextTurn}]));
}
function doAttack(ti){
  lockControls();
  const m=S.party[turnIdx],e=combat.enemies[ti];combat.targetIdx=ti;
  if(Math.random()<0.9){
    let dmg=Math.max(1,eAtk(m)+Math.floor(m.lvl*1.5)+rnd(6)-ENEMIES[e.key].def);
    const crit=Math.random()<0.1;if(crit)dmg*=2;
    e.hp-=dmg;crit?SFX.crit():SFX.hit();
    msg((crit?t("crit")+" ":"")+t("you_hit",eName(e.key),dmg));
    if(e.hp<=0){e.dead=true;msg(t("killed",eName(e.key)),"y")}
  }else{msg(t("miss"));beep(200,.1,"triangle",.05)}
  drawCombat();renderParty();setTimeout(nextTurn,650);
}
function spellMenu(m){
  const known=Object.entries(SPELLS).filter(([k,s])=>s.cls===m.cls&&m.lvl>=s.lv);
  if(!known.length){msg(t("no_target"),"r");return}
  panel(t("cmd_spell"),known.map(([k,s])=>({label:t("spell_"+k),sub:`MP ${s.mp}`,disabled:m.mp<s.mp,fn:()=>castSpell(m,k,s)})).concat([{label:t("cancel"),center:true}]));
}
function castSpell(m,key,sp){
  lockControls();
  m.mp-=sp.mp;SFX.magic();
  if(key==="heal"){
    const hurt=S.party.map((mm)=>({mm})).filter(o=>o.mm.hp>0&&o.mm.hp<o.mm.maxhp);
    if(!hurt.length){m.mp+=sp.mp;msg(t("no_target"),"r");return}
    const tgt=hurt[rnd(hurt.length)].mm;const h=Math.min(sp.heal+m.lvl*2,tgt.maxhp-tgt.hp);tgt.hp+=h;
    msg(t("spell_heal_msg",tgt.name,h),"g");SFX.heal();renderParty();setTimeout(nextTurn,600);return}
  if(key==="revive"){
    const dead=S.party.map((mm)=>({mm})).filter(o=>o.mm.hp<=0);
    if(!dead.length){m.mp+=sp.mp;msg(t("no_target"),"r");return}
    const tgt=dead[0].mm;tgt.hp=Math.floor(tgt.maxhp/2);msg(t("revive_msg",tgt.name),"g");renderParty();setTimeout(nextTurn,600);return}
  const es=aliveEnemies();if(!es.length){m.mp+=sp.mp;return nextTurn()}
  panel(t("spell_"+key),es.map(e=>({label:`${ENEMIES[e.key].emoji} ${eName(e.key)}`,sub:`HP ${e.hp}`,fn:()=>{
    const dmg=sp.power+m.lvl*2+rnd(8);e.hp-=dmg;msg(t("spell_dmg",t("spell_"+key),dmg),"b");SFX.hit();
    if(e.hp<=0){e.dead=true;msg(t("killed",eName(e.key)),"y")}
    drawCombat();renderParty();setTimeout(nextTurn,650)}})));
}
function itemMenu(m){
  const list=Object.entries(S.items).filter(([k,n])=>n>0);
  if(!list.length){msg(t("no_item"),"r");return}
  panel(t("cmd_item"),list.map(([k,n])=>({label:`${t("item_"+k)} ×${n}`,sub:k==="potion"?"+30HP":"+10MP",fn:()=>{
    S.items[k]--;const v=k==="potion"?30:10;
    if(k==="potion"){m.hp=Math.min(m.maxhp,m.hp+v)}else{m.mp=Math.min(m.maxmp,m.mp+v)}
    SFX.heal();msg(t("used_item",t("item_"+k),v),"g");renderParty();setTimeout(nextTurn,500);
  }})).concat([{label:t("cancel"),center:true}]));
}
function flee(m){
  lockControls();
  const aliveE=combat.enemies.filter(e=>!e.dead);
  const eSpdAvg=aliveE.reduce((a,e)=>a+ENEMIES[e.key].spd,0)/Math.max(1,aliveE.length);
  if(!combat.boss&&Math.random()<(eSpd(m)/(eSpd(m)+eSpdAvg))+0.2){SFX.flee();msg(t("flee_ok"),"g");mode="explore";turnIdx=-1;renderParty();renderControls();draw3D()}
  else{msg(t("flee_fail"),"r");setTimeout(nextTurn,600)}
}
function enemyAct(e){
  const alive=S.party.map((m)=>({m})).filter(o=>o.m.hp>0);
  if(!alive.length){gameOver();return}
  const tgt=alive[rnd(alive.length)].m;const ed=ENEMIES[e.key];
  if(Math.random()<0.88){
    const dmg=Math.max(1,ed.atk+rnd(5)+Math.floor(S.floor*1.2)-eDef(tgt));
    tgt.hp-=dmg;SFX.hurt();msg(t("enemy_hit",eName(e.key),dmg),"r");
  }else msg(t("miss"));
  renderParty();setTimeout(()=>{if(!checkWipe())nextTurn()},700);
}
function checkWipe(){if(S.party.every(m=>m.hp<=0)){gameOver();return true}return false}
function endCombat(){
  let exp=0,gold=0;combat.enemies.forEach(e=>{const d=ENEMIES[e.key];exp+=d.exp;gold+=d.gold[0]+rnd(d.gold[1]-d.gold[0]+1)});
  S.gold+=gold;msg(t("victory_win",exp),"y");SFX.gold();
  // 装備ドロップ:通常25%(敵のdropBonusで上乗せ)、ボスはティア3確定
  const wasBoss=combat.boss;
  if(wasBoss){const key=rollGear(3);S.gear.push(key);msg(t("drop_msg",eqName(key)),"y");SFX.equip()}
  else{
    for(const e of combat.enemies){
      const d=ENEMIES[e.key];
      if(Math.random()<0.25+(d.dropBonus||0)){const key=rollGear(1+Math.floor(S.floor/2));S.gear.push(key);msg(t("drop_msg",eqName(key)),"y");SFX.equip();break}
    }
  }
  S.party.forEach(m=>{if(m.hp<=0)return;m.exp+=exp;while(m.exp>=expNeed(m.lvl)){m.lvl++;const g=GROWTH[m.cls];m.maxhp+=g.hp+rnd(3);m.maxmp+=g.mp;m.atk+=g.atk;m.def+=g.def;m.hp=m.maxhp;m.mp=m.maxmp;msg(t("levelup",m.name,m.lvl),"y");SFX.levelup()}});
  combat=null;turnIdx=-1;mode="explore";renderParty();renderHUD();renderControls();draw3D();
  if(wasBoss){S.won=true;saveGame(true);setTimeout(()=>showWin(),900)}
}
function gameOver(){if(mode==="dead")return;SFX.death();mode="dead";$("over-title").textContent=t("gameover_t");$("over-msg").innerText=t("dead_msg");show("screen-over")}
function showWin(){SFX.levelup();$("over-title").textContent=t("win_t");$("over-msg").innerText=t("win_msg");show("screen-over")}

/* ================= save ================= */
const SKEY="grimoire_souls_save_v1";
function saveGame(auto){
  try{localStorage.setItem(SKEY,JSON.stringify({...S,explored:S.explored.map(r=>r.join(""))}));if(!auto)msg(t("saved"),"y")}catch(e){if(!auto)msg(t("saveFail"),"r")}
}
function loadGame(){
  const raw=localStorage.getItem(SKEY);if(!raw)return false;
  try{const d=JSON.parse(raw);d.explored=d.explored.map(r=>r.split("").map(Number));if(!d.gear)d.gear=[];(d.party||[]).forEach(ensureEquip);S=d;return true}catch(e){return false}
}

/* ================= character creation ================= */
let draft=[],editIdx=0;
function rollPts(){let s=0;for(let i=0;i<3;i++)s+=1+rnd(6);return s}
function newDraft(){return{name:NAMES[rnd(NAMES.length)],race:["human","elf","dwarf"][rnd(3)],cls:["fighter","mage","cleric","thief"][rnd(4)],alloc:{hp:0,mp:0,atk:0,def:0,spd:0},pts:0,done:false}}
function randDraft(){const d=newDraft();d.pts=rollPts();let p=d.pts;while(p>0){const k=["hp","mp","atk","def","spd"][rnd(5)];d.alloc[k]++;p--}d.done=true;return d}
function usedPts(d){return d.alloc.hp+d.alloc.mp+d.alloc.atk+d.alloc.def+d.alloc.spd}
function renderCreate(){
  const sl=$("create-slots");sl.innerHTML="";
  draft.forEach((d,i)=>{const b=document.createElement("button");b.className="slot"+(i===editIdx?" cur":"")+(d.done?" done":"");b.textContent=`${i+1}. ${d.name}${d.done?" ✓":""}`;b.onclick=()=>{editIdx=i;renderCreate()};sl.appendChild(b)});
  const d=draft[editIdx],st=calcStats(d),left=d.pts-usedPts(d);
  const B={hp:RACES[d.race].hp+CMOD[d.cls].hp,mp:RACES[d.race].mp+CMOD[d.cls].mp,atk:RACES[d.race].atk+CMOD[d.cls].atk,def:RACES[d.race].def+CMOD[d.cls].def,spd:RACES[d.race].spd+CMOD[d.cls].spd};
  const ed=$("create-editor");
  let html=`<div class="crow"><span>${t("stat_name")}</span><span><input id="in-name" maxlength="10"><button class="pick" id="b-dice">🎲</button></span></div>
  <div class="crow"><span>${t("stat_race")}</span><span>`;
  Object.keys(RACES).forEach(r=>{html+=`<button class="pick pick-r ${r===d.race?"on":""}" data-k="${r}">${RACE[S.lang][r]}</button>`});
  html+=`</span></div><div class="crow"><span>${t("stat_class")}</span><span>`;
  Object.keys(CMOD).forEach(c=>{html+=`<button class="pick pick-c ${c===d.cls?"on":""}" data-k="${c}">${CLS[S.lang][c]}</button>`});
  html+=`</span></div>`;
  [["hp","HP"],["mp","MP"],["atk","ATK"],["def","DEF"],["spd","SPD"]].forEach(([k,lab])=>{
    const val={hp:st.maxhp,mp:st.mp,atk:st.atk,def:st.def,spd:st.spd}[k];
    html+=`<div class="crow"><span>${lab} <small style="color:#556">(${B[k]})</small></span><span><b class="statv">${val}</b>${d.pts>0?`<button class="ab am" data-k="${k}"${d.alloc[k]<=0?" disabled":""}>−</button><button class="ab ap" data-k="${k}"${left<=0?" disabled":""}>＋</button>`:""}</span></div>`;
  });
  html+=`<div class="crow"><span>${t("roll")}</span><span style="color:var(--gold)">${d.pts?t("pts",left):"—"} <button class="pick" id="b-roll">🎲</button></span></div>
  <div class="bonus-note">${t("bonus_note")}</div>
  <button class="pbtn center" id="b-confirm"${d.pts<=0?" disabled":""} style="margin-top:10px;color:var(--gold)">${d.done?"✓ ":""}${t("confirm")}</button>`;
  ed.innerHTML=html;
  const inName=$("in-name");inName.value=d.name;
  inName.oninput=()=>{draft[editIdx].name=inName.value||"?";const b=$("create-slots").children[editIdx];if(b)b.textContent=`${editIdx+1}. ${draft[editIdx].name}${draft[editIdx].done?" ✓":""}`};
  $("b-dice").onclick=()=>{d.name=NAMES[rnd(NAMES.length)];renderCreate()};
  ed.querySelectorAll(".pick-r").forEach(b=>b.onclick=()=>{d.race=b.dataset.k;renderCreate()});
  ed.querySelectorAll(".pick-c").forEach(b=>b.onclick=()=>{d.cls=b.dataset.k;renderCreate()});
  ed.querySelectorAll(".ab.ap").forEach(b=>b.onclick=()=>{if(left>0){d.alloc[b.dataset.k]++;SFX.step();renderCreate()}});
  ed.querySelectorAll(".ab.am").forEach(b=>b.onclick=()=>{if(d.alloc[b.dataset.k]>0){d.alloc[b.dataset.k]--;SFX.step();renderCreate()}});
  $("b-roll").onclick=()=>{d.pts=rollPts();d.alloc={hp:0,mp:0,atk:0,def:0,spd:0};d.done=false;SFX.gold();renderCreate()};
  $("b-confirm").onclick=()=>{if(d.pts<=0)return;d.done=true;SFX.heal();const nx=draft.findIndex(x=>!x.done);editIdx=nx>=0?nx:editIdx;renderCreate()};
  $("btn-start").disabled=!draft.every(x=>x.done);
}

/* ================= boot ================= */
function refreshTexts(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;el.textContent=t(k)});
  if(S&&S.map){renderHUD();if(mode==="explore")renderControls()}
  $("btn-lang-title").textContent=(S?S.lang:"ja")==="ja"?"ENGLISH":"日本語";
  $("btn-snd-title").textContent=S?(S.sound?"🔊 ON":"🔇 OFF"):"🔊";
}
function defaultState(){return{lang:localStorage.getItem("gs_lang")||"ja",sound:localStorage.getItem("gs_snd")!=="0",party:[],gear:[],floor:1,gold:50,items:{potion:3,ether:0},map:null,explored:null,px:11,py:11,dir:0,won:false}}
function enterGame(){mode="explore";show("screen-game");renderHUD();renderParty();renderControls();draw3D()}

$("btn-new").onclick=()=>{S=defaultState();mode="create";draft=[newDraft(),newDraft(),newDraft(),newDraft()];editIdx=0;show("screen-create");refreshTexts();renderCreate()};
$("btn-load").onclick=()=>{const keep=(S&&S.lang)||"ja";if(loadGame()){S.lang=keep;enterGame()}else alert(t("noSave"))};
$("btn-reroll").onclick=()=>{draft=[randDraft(),randDraft(),randDraft(),randDraft()];editIdx=0;SFX.gold();renderCreate()};
$("btn-start").onclick=()=>{
  if(!draft.every(x=>x.done))return;
  S.party=draft.map(d=>{const st=calcStats(d);return{name:d.name||"Hero",race:d.race,cls:d.cls,lvl:1,exp:0,hp:st.maxhp,maxhp:st.maxhp,mp:st.mp,maxmp:st.mp,atk:st.atk,def:st.def,spd:st.spd,eq:{weapon:null,twohand:null,helm:null,armor:null,shield:null}}});
  genFloor(1);enterGame();msg(`— ${t("floor",1)} —`,"y");saveGame(true);
};
$("btn-over-new").onclick=()=>$("btn-new").onclick();
$("btn-over-load").onclick=()=>$("btn-load").onclick();
function toggleLang(){S=S||defaultState();S.lang=S.lang==="ja"?"en":"ja";localStorage.setItem("gs_lang",S.lang);refreshTexts();if(mode==="create")renderCreate()}
function toggleSound(){S=S||defaultState();S.sound=!S.sound;localStorage.getItem&&localStorage.setItem("gs_snd",S.sound?"1":"0");refreshTexts()}
$("btn-lang").onclick=toggleLang;$("btn-lang-title").onclick=toggleLang;
$("btn-snd").onclick=toggleSound;$("btn-snd-title").onclick=toggleSound;
$("btn-save").onclick=()=>{if(S&&S.map)saveGame(false)};
$("btn-map").onclick=()=>{showMap=!showMap;if(mode==="explore"&&S&&S.map)draw3D()};
document.addEventListener("keydown",e=>{
  if(mode!=="explore"||$("overlay").classList.contains("show"))return;
  if(e.key==="ArrowUp")move(1);else if(e.key==="ArrowLeft")turn(-1);else if(e.key==="ArrowRight")turn(1);
  else if(e.key==="Enter"||e.key===" ")look();else if(e.key.toLowerCase()==="m")$("btn-map").onclick();
});
S=defaultState();refreshTexts();
</script>
</body>
</html>
